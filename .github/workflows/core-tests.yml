name: Core tests

on:
  push:
    paths:
      - "Assets/Relicbound/Scripts/Core/**"
      - "Tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Relicbound.Core
        run: dotnet test Tests/Relicbound.Core.Tests --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: Tests/Relicbound.Core.Tests/TestResults/
