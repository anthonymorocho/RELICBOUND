name: Unity

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["Docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Tests del núcleo (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test Tests/BeforeItWasYou.Core.Tests --logger "console;verbosity=normal"

  unity:
    name: Configurar, generar escenas, testear y capturar
    runs-on: ubuntu-latest
    environment: UNITY_LICENSE
    permissions:
      contents: read
      checks: write
    timeout-minutes: 75
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-linux-

      - name: Configurar proyecto, generar escenas y capturar evidencias
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: BeforeItWasYou.EditorTools.CiPipeline.RunFromCommandLine
          allowDirtyBuild: true
          versioning: None

      - name: Tests EditMode y PlayMode (recorrido del jugador)
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Tests Unity

      - name: Empaquetar archivos generados por Unity
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          git status --porcelain --untracked-files=all -- Assets Packages ProjectSettings | cut -c4- > generated-files.txt
          cat generated-files.txt
          if [ -s generated-files.txt ]; then tar czf unity-generated.tgz --ignore-failed-read -T generated-files.txt; else tar czf unity-generated.tgz --files-from /dev/null; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-generated
          path: unity-generated.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: Evidence/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results
