name: Unity

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["Docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Tests del núcleo (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test Tests/BeforeItWasYou.Core.Tests --logger "console;verbosity=normal"

  # Si la variable del repositorio UNITY_RUNNER vale "local", todo se ejecuta en el PC del usuario
  # (runner autoalojado con etiqueta "unity", Unity instalado y GPU): minutos en lugar de una hora.
  unity-local:
    name: Unity en el PC local (GPU)
    if: vars.UNITY_RUNNER == 'local'
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 90
    env:
      UNITY_EXE: ${{ vars.UNITY_EDITOR_PATH || 'C:\Program Files\Unity\Hub\Editor\6000.3.27f1\Editor\Unity.exe' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          clean: false
      - name: Configurar proyecto, generar escenas y capturar evidencias
        shell: pwsh
        run: |
          & "$env:UNITY_EXE" -batchmode -projectPath "$PWD" -executeMethod BeforeItWasYou.EditorTools.CiPipeline.RunFromCommandLine -logFile build.log | Out-Default
          if ($LASTEXITCODE -ne 0) { Get-Content build.log -Tail 80; exit $LASTEXITCODE }
      - name: Tests EditMode
        shell: pwsh
        run: |
          & "$env:UNITY_EXE" -batchmode -projectPath "$PWD" -runTests -testPlatform EditMode -testResults test-results/editmode.xml -logFile editmode.log | Out-Default
          if ($LASTEXITCODE -ne 0) { Get-Content editmode.log -Tail 60; exit $LASTEXITCODE }
      - name: Tests PlayMode (recorrido del jugador y capturas)
        shell: pwsh
        run: |
          & "$env:UNITY_EXE" -batchmode -projectPath "$PWD" -runTests -testPlatform PlayMode -testResults test-results/playmode.xml -logFile playmode.log | Out-Default
          if ($LASTEXITCODE -ne 0) { Get-Content playmode.log -Tail 60; exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: Evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: |
            test-results
            *.log

  unity:
    name: Configurar, generar escenas, testear y capturar
    if: vars.UNITY_RUNNER != 'local'
    runs-on: ubuntu-latest
    environment: UNITY_LICENSE
    permissions:
      contents: read
      checks: write
    timeout-minutes: 160
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # La caché de Library (importaciones y shaders compilados) se restaura y se guarda siempre, aunque falle
      # algún paso: la primera compilación de shaders URP por CPU tarda mucho y no debe repetirse.
      - uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: Library-linux-

      - name: Configurar proyecto, generar escenas y capturar evidencias
        timeout-minutes: 110
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: BeforeItWasYou.EditorTools.CiPipeline.RunFromCommandLine
          allowDirtyBuild: true
          versioning: None

      - name: Tests EditMode y PlayMode (recorrido del jugador)
        timeout-minutes: 45
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Tests Unity

      - name: Guardar caché de Library
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      - name: Empaquetar archivos generados por Unity
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          git status --porcelain --untracked-files=all -- Assets Packages ProjectSettings | cut -c4- > generated-files.txt
          cat generated-files.txt
          if [ -s generated-files.txt ]; then tar czf unity-generated.tgz --ignore-failed-read -T generated-files.txt; else tar czf unity-generated.tgz --files-from /dev/null; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-generated
          path: unity-generated.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: Evidence/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results
