name: Unity

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-and-test:
    name: Configurar y testear (EditMode)
    runs-on: ubuntu-latest
    environment: UNITY_LICENSE
    permissions:
      contents: read
      checks: write
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-linux-

      - name: Configurar proyecto (URP, Player, Input)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Relicbound.EditorTools.ProjectBootstrap.RunFromCommandLine
          allowDirtyBuild: true
          versioning: None

      - name: Tests EditMode
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Tests EditMode

      - name: Empaquetar archivos generados por Unity
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          # Todo lo que Unity haya creado o modificado (metas, ProjectSettings, assets de URP...).
          git status --porcelain --untracked-files=all -- Assets Packages ProjectSettings | cut -c4- > generated-files.txt
          cat generated-files.txt
          if [ -s generated-files.txt ]; then tar czf unity-generated.tgz -T generated-files.txt; else tar czf unity-generated.tgz --files-from /dev/null; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-generated
          path: unity-generated.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results
